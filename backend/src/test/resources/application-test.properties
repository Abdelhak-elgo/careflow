# Test profile — overrides main application.properties.
# Disables OAuth2 issuer discovery so tests do not need a live Keycloak on :8080.
# The test SecurityFilterChain (see TestSecurityConfiguration) permits all requests,
# and a stub JwtDecoder is provided if any code path still resolves one.
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# MinIO — stub values so MinioClient bean instantiates without a live server.
# No test currently exercises real object upload/download.
careflow.storage.endpoint=http://localhost:9000
careflow.storage.access-key=test
careflow.storage.secret-key=test-secret
careflow.storage.bucket=careflow-attachments-test
