spring.application.name=careflow
server.port=8187

# Datasource (dev — see docker-compose.yml at project root)
spring.datasource.url=jdbc:postgresql://localhost:5444/careflow
spring.datasource.username=careflow
spring.datasource.password=careflow

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
