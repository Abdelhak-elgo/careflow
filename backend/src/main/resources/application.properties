spring.application.name=careflow
server.port=8187

# Datasource (dev — see docker-compose.yml at project root)
spring.datasource.url=jdbc:postgresql://localhost:5444/careflow
spring.datasource.username=careflow
spring.datasource.password=careflow

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.info.title=CareFlow API
springdoc.api-docs.info.version=0.1.0
springdoc.api-docs.info.description=Plateforme de remboursement de soins — POC hexagonal Spring Boot 4.
springdoc.api-docs.info.contact.name=CareFlow Team
springdoc.api-docs.info.license.name=Proprietary

# Rate limiting (POST /api/claims) — per X-User-Id, fallback to client IP
careflow.rate-limit.capacity=20
careflow.rate-limit.refill-period=PT1M

# Keycloak (OAuth2 resource server) — see docker-compose.yml
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/careflow
