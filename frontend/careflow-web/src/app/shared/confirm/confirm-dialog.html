@if (confirm.state(); as s) {
  <div
    class="fixed inset-0 z-[60] flex items-center justify-center px-4"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="absolute inset-0 bg-[color:var(--cf-ink)]/40 backdrop-blur-sm"
      (click)="confirm.dismiss()"
      aria-hidden="true"
    ></div>

    <div class="cf-surface cf-scale-in relative w-full max-w-md p-6 space-y-5 shadow-[0_30px_80px_-30px_rgba(26,22,19,0.35)]">
      <div class="flex items-start gap-3">
        <span
          class="mt-1 inline-flex h-9 w-9 items-center justify-center rounded-full"
          [style.background]="s.tone === 'danger' ? 'rgba(184, 84, 46, 0.10)' : 'var(--cf-teal-soft)'"
          [style.color]="s.tone === 'danger' ? 'var(--cf-clay)' : 'var(--cf-teal)'"
        >
          @if (s.tone === 'danger') {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
              <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.876c.673 1.167-.17 2.629-1.516 2.629H3.72c-1.347 0-2.19-1.462-1.516-2.629L8.485 2.495ZM10 6a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 6Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
              <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z" clip-rule="evenodd" />
            </svg>
          }
        </span>
        <div class="flex-1 min-w-0">
          <h2 class="font-display text-xl text-[color:var(--cf-ink)]">{{ s.title }}</h2>
          <p class="mt-1 text-sm text-[color:var(--cf-ink-soft)]">{{ s.message }}</p>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-1">
        <button type="button" class="cf-btn-ghost" (click)="confirm.dismiss()">
          {{ s.cancelLabel }}
        </button>
        <button
          type="button"
          (click)="confirm.accept()"
          class="inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium text-white transition"
          [style.background]="s.tone === 'danger' ? 'var(--cf-clay)' : 'var(--cf-ink)'"
        >{{ s.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
