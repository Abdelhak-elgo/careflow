<div class="min-h-screen flex flex-col">
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto flex items-center gap-6 px-6 py-4">
      <a routerLink="/" class="text-lg font-semibold text-slate-900">CareFlow</a>
      <nav class="flex gap-4 text-sm flex-1">
        <a
          routerLink="/"
          routerLinkActive="text-blue-600 font-medium"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-600 hover:text-slate-900"
        >Tableau de bord</a>
        <a
          routerLink="/submit"
          routerLinkActive="text-blue-600 font-medium"
          class="text-slate-600 hover:text-slate-900"
        >Nouvelle demande</a>
        @if (auth.isAdmin()) {
          <a
            routerLink="/review"
            routerLinkActive="text-blue-600 font-medium"
            class="text-slate-600 hover:text-slate-900"
          >Revue admin</a>
          <a
            routerLink="/admin/audit"
            routerLinkActive="text-blue-600 font-medium"
            class="text-slate-600 hover:text-slate-900"
          >Audit</a>
        }
      </nav>
      <div class="flex items-center gap-3 text-sm">
        @if (auth.isLoggedIn()) {
          <span class="text-slate-500">
            {{ auth.userName() }}
            @if (auth.isAdmin()) {
              <span class="ml-1 rounded bg-purple-100 text-purple-700 px-1.5 py-0.5 text-[10px] uppercase tracking-wide">admin</span>
            } @else {
              <span class="ml-1 rounded bg-slate-100 text-slate-700 px-1.5 py-0.5 text-[10px] uppercase tracking-wide">patient</span>
            }
          </span>
          <button
            type="button"
            (click)="auth.logout()"
            class="rounded-md border border-slate-300 bg-white px-3 py-1 text-sm text-slate-700 hover:bg-slate-50"
          >Déconnexion</button>
        } @else {
          <button
            type="button"
            (click)="auth.login()"
            class="rounded-md bg-blue-600 px-3 py-1 text-sm font-medium text-white hover:bg-blue-700"
          >Se connecter</button>
        }
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-6 py-8">
    <router-outlet />
  </main>

  <div class="fixed top-4 right-4 flex flex-col gap-2 z-50 w-96 max-w-full">
    @for (n of notifications.notifications(); track n.id) {
      <div
        class="rounded-lg shadow-lg border px-4 py-3 flex items-start gap-3 bg-white"
        [class.border-emerald-300]="n.severity === 'success'"
        [class.border-red-300]="n.severity === 'error'"
        [class.border-slate-200]="n.severity === 'info'"
      >
        <span
          class="mt-0.5 h-2.5 w-2.5 rounded-full flex-shrink-0"
          [class.bg-emerald-500]="n.severity === 'success'"
          [class.bg-red-500]="n.severity === 'error'"
          [class.bg-slate-400]="n.severity === 'info'"
        ></span>
        <p class="flex-1 text-sm text-slate-800">{{ n.message }}</p>
        <button
          type="button"
          (click)="notifications.dismiss(n.id)"
          class="text-slate-400 hover:text-slate-600 text-sm"
          aria-label="Fermer"
        >×</button>
      </div>
    }
  </div>
</div>
