name: careflow

services:
  postgres:
    image: postgres:16.2
    container_name: careflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5434:5432"
    volumes:
      - careflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careflow-postgres-data:
